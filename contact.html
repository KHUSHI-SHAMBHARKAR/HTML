</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="index.html#about">About LTS</a>
                </li>
                <li>
                    <a href="index.html#menu">Our Menu</a>
                </li>
                <li>

                </li>
            </ul>
        </nav>
    <figure>
        <img src="tacos_close_up_400x260.png" alt="Little Taco Shop Tacos">
        <figcaption>Little Taco Shop Tacos</figcaption>
    </figure>
    </header>
    <main>
        <section id="contact">
        <form action="https://httpbin.org/get" method="get">
            <h2>Our Contact Form</h2>
            <fieldset>
                <legend>Send Us A Message</legend>
                <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Your Name">
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" required placeholder="Your Email">
                </p>
                <br>
                <label for="message" id="message">Your Message:</label><br>
                <textarea name="message" id="message" cols="30" rows="10" placeholder="Type your msg here.."></textarea>
            </fieldset>
            <button type="send">Send</button>
            <button type="reset">Reset</button>
        </form>
    </section>
    </main>
    <footer id="contact">
        <h2>Our Location</h2>
        <address textstyle="font-style:italic;">
            <cite >
            <p>123 Taco Street</p>
            <p>San Antonio, TX 78205</p>
            </cite>
            Phone:<a href="tel:+210-555-1234">210-555-1234</a>
        </address>
        <br>
        <a href="#">Back to Top</a>
        <hr>
        <p>Copyright &copy; The Little Taco Shop</p>
    </footer>
</body>
</html>
